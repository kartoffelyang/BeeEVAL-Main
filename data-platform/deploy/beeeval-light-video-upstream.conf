# Install under /etc/nginx/conf.d/ (http context).
upstream beeeval_light_video {
    server open.beeeval.com:443;
    keepalive 16;
}
log_format beeeval_light_video_timing escape=json
    '{"status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,"header_time":"$upstream_header_time","upstream_time":"$upstream_response_time"}';
