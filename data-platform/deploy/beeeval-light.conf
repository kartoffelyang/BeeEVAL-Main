location = /light { return 308 /data/; }
location ^~ /data/api/nas/stream {
    proxy_pass https://beeeval_light_video/api/nas/stream;
    proxy_set_header Host open.beeeval.com;
    proxy_ssl_server_name on;
    proxy_ssl_name open.beeeval.com;
    proxy_ssl_verify on;
    # The upstream CA chain includes multiple intermediates. Keep verification enabled.
    proxy_ssl_verify_depth 4;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    access_log /var/log/nginx/beeeval-light-video.log beeeval_light_video_timing;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 600s;
}
location ^~ /data/api/nas/proxy-stream {
    proxy_pass https://beeeval_light_video/api/nas/proxy-stream;
    proxy_set_header Host open.beeeval.com;
    proxy_ssl_server_name on;
    proxy_ssl_name open.beeeval.com;
    proxy_ssl_verify on;
    # The upstream CA chain includes multiple intermediates. Keep verification enabled.
    proxy_ssl_verify_depth 4;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    access_log /var/log/nginx/beeeval-light-video.log beeeval_light_video_timing;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 600s;
}
location ^~ /data/api/video/stream {
    proxy_pass https://beeeval_light_video/api/video/stream;
    proxy_set_header Host open.beeeval.com;
    proxy_ssl_server_name on;
    proxy_ssl_name open.beeeval.com;
    proxy_ssl_verify on;
    # The upstream CA chain includes multiple intermediates. Keep verification enabled.
    proxy_ssl_verify_depth 4;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    access_log /var/log/nginx/beeeval-light-video.log beeeval_light_video_timing;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 600s;
}
location = /data/api/video/stream/sign {
    proxy_pass http://127.0.0.1:5188/api/video/stream/sign;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_read_timeout 90s;
}
location ^~ /data/api/ {
    proxy_pass http://127.0.0.1:5188/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_read_timeout 600s;
    proxy_buffering off;
    client_max_body_size 500m;
}
location ^~ /data/screenshots/ {
    proxy_pass http://127.0.0.1:5188/screenshots/;
    proxy_set_header Authorization $http_authorization;
    proxy_read_timeout 90s;
}
location ^~ /data/ {
    alias /var/www/beeeval-light/;
    try_files $uri $uri/ /data/index.html;
    add_header X-Content-Type-Options nosniff always;
}
