location = /main { return 308 /main/; }
location = /main/_member_auth {
    internal;
    proxy_pass http://127.0.0.1:5190/auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
}
location = /main/_report_auth {
    internal;
    proxy_pass http://127.0.0.1:5190/auth?kind=report;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
}
location ^~ /main/scenes/library/ {
    auth_request /main/_member_auth;
    error_page 401 = @main_scene_login;
    alias /var/www/beeeval-main/scenes/library/;
    add_header Cache-Control "private, no-store" always;
    add_header X-Frame-Options SAMEORIGIN always;
}
location @main_scene_login {
    return 302 /main/scenes/login.html;
}
location ^~ /main/reports/ {
    auth_request /main/_report_auth;
    alias /var/www/beeeval-main/reports/;
    add_header Cache-Control "private, no-store" always;
    add_header X-Frame-Options SAMEORIGIN always;
}
location /main/ {
    alias /var/www/beeeval-main/;
    index index.html;
    add_header Cache-Control "no-cache" always;
    add_header X-Frame-Options SAMEORIGIN always;
}
