# Included inside the www.beeeval.com HTTPS vhost. All apps use one release.
root /var/www/beeeval-main;
index index.html;
location ^~ /api/ {
    proxy_pass http://127.0.0.1:5190;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 20k;
}
location = /_scene_auth {
    internal;
    proxy_pass http://127.0.0.1:5190/auth?kind=scene;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
}
location = /_data_auth {
    internal;
    proxy_pass http://127.0.0.1:5190/auth?kind=data;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
}
location = /_report_auth {
    internal;
    proxy_pass http://127.0.0.1:5190/auth?kind=report&path=$request_uri;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
}
location = /scenes { return 308 /scenes/; }
location ^~ /scenes/api/ {
    auth_request /_scene_auth;
    proxy_pass http://127.0.0.1:5180/api/;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 100k;
    proxy_read_timeout 75s;
}
location ^~ /scenes/images/ { try_files $uri =404; }
location ^~ /scenes/ {
    auth_request /_scene_auth;
    error_page 401 403 = @scene_preview;
    try_files $uri $uri/ /scenes/index.html;
    add_header Cache-Control "private, no-store" always;
    add_header X-Frame-Options SAMEORIGIN always;
}
location @scene_preview { return 302 /preview.html?product=scenes&path=$request_uri; }
location ^~ /reports/ {
    auth_request /_report_auth;
    error_page 401 403 = @report_preview;
    try_files $uri $uri/ =404;
    add_header Cache-Control "private, no-store" always;
    add_header Content-Disposition "inline" always;
    add_header X-Robots-Tag "noindex, noarchive, nosnippet" always;
    add_header X-Frame-Options SAMEORIGIN always;
}
location @report_preview { return 302 /preview.html?path=$request_uri; }
include /etc/nginx/snippets/beeeval-main-data.conf;
# Retired page URLs are redirects only. No legacy application is served.
location = /main { return 308 /; }
location = /main/ { return 308 /; }
location = /main/scenes { return 308 /scenes/; }
location = /main/scenes/ { return 308 /scenes/; }
location ~ ^/main/scenes/library/?(.*)$ { return 308 /scenes/$1$is_args$args; }
location ~ ^/main/(.*)$ { return 308 /$1$is_args$args; }
location = /light { return 308 /data/; }
location ~ ^/light/(.*)$ { return 308 /data/$1$is_args$args; }
location = /scene { return 308 /scenes/; }
location ~ ^/scene/(.*)$ { return 308 /scenes/$1$is_args$args; }
location / {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache" always;
    add_header X-Frame-Options SAMEORIGIN always;
}
